services:
  - type: web
    name: indian-paper-trader
    runtime: static
    buildCommand: ""
    staticPublishPath: ./public
    headers:
      - path: /live_data.json
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
